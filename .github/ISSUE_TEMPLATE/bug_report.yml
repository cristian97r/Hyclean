name: Bug report
description: A game crashes, freezes, renders wrong or misbehaves in Lichii
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One bug per report, please. Search the open issues first, and try the [latest build](https://github.com/tasarren/Lichii/releases) if you can.
        Reports without a log usually can't be worked on, so the log field is required.
        Low frame rate with nothing broken? Use the **Performance report** form instead.
        Do not post games, keys, firmware, account credentials or unauthorized download links. Bug bundles, GPU traces, shader caches and memory dumps can contain game data: do not attach them publicly; ask a maintainer for handling instructions first.

  - type: input
    id: build
    attributes:
      label: Lichii build
      description: "The release you downloaded (for example `next build 2`), or the first line of eden_log.txt (`Lichii Version: ... | next-build-2`)."
      placeholder: "e.g. next build 2"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Crash or freeze
        - Graphics look wrong
        - Stutter or hitches
        - Gameplay, audio or input
        - Other
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - "The Legend of Zelda: Ocarina of Time"
        - Mario Kart World
        - Donkey Kong Bananza
        - Kirby Air Riders
        - Pokémon Pokopia
        - Fire Emblem
        - Splatoon Raiders
        - Hyrule Warriors
        - Mario Tennis Fever
        - Yoshi and the Mysterious Book
        - Welcome Tour
        - A Switch 1 game
        - Other / not listed
    validations:
      required: true

  - type: input
    id: game_other
    attributes:
      label: Game name and version
      description: Needed for Switch 1 and unlisted games. The version is shown in the game list.

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "e.g. Ryzen 7 5700X / Core i5-12400F / Steam Deck"
    validations:
      required: true

  - type: dropdown
    id: ram
    attributes:
      label: System memory (RAM)
      options:
        - 8 GB or less
        - 16 GB
        - 32 GB
        - 64 GB or more
    validations:
      required: true

  - type: dropdown
    id: gpu
    attributes:
      label: Graphics card
      options:
        - NVIDIA RTX 50 series
        - NVIDIA RTX 40 series
        - NVIDIA RTX 30 series
        - NVIDIA RTX 20 or GTX 16 series
        - NVIDIA GTX 10 series or older
        - AMD RX 9000 series
        - AMD RX 7000 series
        - AMD RX 6000 series or older
        - Intel Arc
        - Integrated graphics INTEL
        - Integrated graphics AMD
        - Apple silicon
        - Other
    validations:
      required: true

  - type: input
    id: gpu_driver
    attributes:
      label: GPU model, video memory and driver version
      placeholder: "e.g. RTX 4060 Ti 8 GB, NVIDIA 581.57 / RX 6600 8 GB, Adrenalin 25.10.1 / Steam Deck, Mesa 25.2"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - SteamOS
        - macOS
        - Android
        - Other
    validations:
      required: true

  - type: checkboxes
    id: regression
    attributes:
      label: Regression
      options:
        - label: This is a regression (it worked in an older build)

  - type: input
    id: last_good
    attributes:
      label: Last known working build
      description: Only fill this in if it's a regression.

  - type: textarea
    id: settings
    attributes:
      label: Settings you changed
      description: |
        Anything not at its default, globally or in the game's properties. For Ocarina of Time, the ones that matter most:
        render scale, anti-aliasing (Game / No sharpening), upscaler (FSR / DLSS), RAM Usage Mode, VRAM Usage, ASTC Recompression, GPU Mode, frame rate limit, mods or cheats.
        Did the problem go away when you changed one of them back? Say which.
      placeholder: "e.g. Ultra Performance render scale, anti-aliasing Game, ASTC Recompression BC3, RAM Usage Mode Low"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game it happens and what you did just before, and how often (every time, sometimes, once).
      placeholder: "1. Load the save in Kakariko\n2. Walk to the windmill\n3. ..."
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        Drag and drop eden_log.txt here. In Lichii, open File → Open Lichii Folders → Log Folder.
        Upload it right after the problem happens and before you start Lichii again: eden_log.txt is the latest session and eden_log.txt.old the one before. Zip it if GitHub says it's too big.
        For a crash on Windows, also attach eden_crash.dmp from the same folder if there is one.
        Review the log for personal information and credentials before posting. This field is for the text log, not a Ctrl+F12 bug bundle or a memory dump.
      placeholder: Drop eden_log.txt here
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Video or screenshot
      description: |
        Drag and drop a screenshot or a short video that shows the problem (GitHub takes up to 10 MB for videos; a YouTube or Streamable link works too). For a crash with nothing to see, write "none".
        Do not attach lichii-bug-*.zip files from Help → Report a Bug here: they hold game data. Ask in the issue and we tell you where to send it privately.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: My game is dumped from my own console
          required: true
